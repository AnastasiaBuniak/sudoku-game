# Static site for Google Play / support links (landing + privacy).
# Publish directory is docs/ — no build step required.

[build]
  publish = "docs"
  command = "true"

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy.html"
  status = 301
